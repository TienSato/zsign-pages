<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zsign - Fast Sign iOS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        
        .logo {
            font-size: 3.5rem;
            font-weight: 700;
            color: #2563eb;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }
        
        .subtitle {
            font-size: 1.25rem;
            color: #6b7280;
            margin-bottom: 48px;
            font-weight: 400;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        
        .btn-download {
            background: #2563eb;
            color: white;
        }
        
        .btn-download:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
        }
        
        .btn-telegram {
            background: white;
            color: #0088cc;
            border-color: #0088cc;
        }
        
        .btn-telegram:hover {
            background: #0088cc;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 136, 204, 0.2);
        }
        
        .icon {
            width: 20px;
            height: 20px;
        }
        
        @media (max-width: 640px) {
            .logo {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1rem;
                margin-bottom: 32px;
            }
            
            .btn {
                padding: 14px 24px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="logo">Zsign</h1>
        <p class="subtitle">Fast Sign iOS</p>
        
        <div class="button-group">
            <a href="https://zsign.app/Zsign_1.4.5.ipa" class="btn btn-download">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download Zsign 1.4.4
            </a>
            
            <a href="https://t.me/zsignapp" class="btn btn-telegram" target="_blank">
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/>
                </svg>
                Telegram Channel
            </a>
        </div>
    </div>
</body>
</html>
